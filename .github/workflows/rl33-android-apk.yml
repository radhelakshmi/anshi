
name: RL-33 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "institute-portal/**"
      - "assets/**"
      - ".github/workflows/rl33-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout website
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Prepare app files
        shell: bash
        run: |
          mkdir -p android-app/www
          cp -R assets android-app/www/
          cp -R institute-portal android-app/www/
          cp -R ./*.html ./*.css ./*.js android-app/www/

          cat > android-app/www/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#10182c">
            <title>RL-33</title>
            <style>
              *{box-sizing:border-box}
              body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#10182c,#233e67);color:white;font-family:Arial,sans-serif;text-align:center}
              main{padding:28px}
              img{width:112px;height:112px;object-fit:contain;border-radius:24px;background:white;padding:8px}
              h1{font-size:32px;letter-spacing:2px;margin:22px 0 8px}
              p{color:#d8e1f3;letter-spacing:2px;font-size:13px}
              .line{width:48px;height:3px;background:#d8b56d;margin:24px auto;border-radius:4px}
              .loading{font-size:12px;letter-spacing:1px}
            </style>
          </head>
          <body>
            <main>
              <img src="institute-portal/logo.png" alt="RL-33 Logo">
              <h1>RL-33</h1>
              <p>LEARN · GROW · ACHIEVE</p>
              <div class="line"></div>
              <div class="loading">OPENING YOUR PORTAL...</div>
            </main>
            <script>
              setTimeout(function(){
                location.replace("institute-portal/index.html");
              },1800);
            </script>
          </body>
          </html>
          EOF

          cat > android-app/package.json <<'EOF'
          {
            "name": "rl33-android-app",
            "version": "1.0.0",
            "private": true,
            "description": "RL-33 Institute Android App",
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

          cat > android-app/capacitor.config.json <<'EOF'
          {
            "appId": "com.rl33.institute",
            "appName": "RL-33 Institute",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RL33-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
