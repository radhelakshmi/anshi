
name: RL-33 Full Offline Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Verify Existing Website
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f institute-portal/index.html
          echo "RL-33 website files verified."

      - name: Prepare Bundled Website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-app/www

          # Copy the existing website, not a redirect page.
          # Exclude generated files and the Android build folder.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='android-app/' \
            --exclude='node_modules/' \
            --exclude='*.zip' \
            ./ android-app/www/

          test -f android-app/www/index.html
          test -f android-app/www/institute-portal/index.html

          if grep -q 'window.location.replace("https://radhelakshmi.github.io/anshi/index.html")' \
            android-app/www/index.html; then
            echo "Unexpected redirect detected in bundled website."
            exit 1
          fi

      - name: Configure Capacitor
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          cat > package.json <<'EOF'
          {
            "name": "rl33-full-offline-website",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "android:sync": "cap sync android"
            },
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rl33.website",
            "appName": "RL-33",
            "webDir": "www"
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android-app/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug

          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RL33-Full-Offline-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
