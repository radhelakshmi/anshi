
name: Build RL-33 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare RL-33 app
        shell: bash
        run: |
          set -e

          mkdir -p android-app/www/institute-portal

          cp institute-portal/index.html \
             android-app/www/institute-portal/index.html

          cp institute-portal/logo.png \
             android-app/www/institute-portal/logo.png

          cp institute-portal/qrscan.jpg \
             android-app/www/institute-portal/qrscan.jpg

          cp -R assets android-app/www/assets

          cp style.css script.js rl33-institute.html \
             services.html services-style.css services-script.js \
             document-services.html notes.html android-app/www/

          cat > android-app/www/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport"
              content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#071a3a">
            <title>RL-33</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0; min-height: 100vh;
                display: grid; place-items: center;
                background: radial-gradient(circle at top,
                  #183866, #071a3a 60%, #040914);
                color: #fff; font-family: system-ui, sans-serif;
                text-align: center;
              }
              .brand { padding: 28px; }
              .seal {
                width: 108px; height: 108px;
                border: 2px solid #d6aa55;
                border-radius: 50%; margin: auto auto 24px;
                display: grid; place-items: center;
                color: #f0d18a; font-size: 32px;
                font-weight: 800; letter-spacing: 2px;
                box-shadow: 0 0 35px #d6aa5528;
              }
              h1 { letter-spacing: 5px; margin: 0; }
              p { color: #e5d4ad; letter-spacing: 2px; }
              .line {
                width: 100px; height: 3px;
                margin: 26px auto; background: #d6aa55;
                animation: grow 1.5s ease-in-out infinite alternate;
              }
              @keyframes grow {
                from { transform: scaleX(.35); }
                to { transform: scaleX(1); }
              }
            </style>
          </head>
          <body>
            <main class="brand">
              <div class="seal">RL</div>
              <h1>RL-33</h1>
              <p>ONE MISSION · ONE LEGACY</p>
              <div class="line"></div>
              <small>INSTITUTE & MEMBER PORTAL</small>
            </main>
            <script>
              setTimeout(() => {
                location.replace('institute-portal/index.html');
              }, 1800);
            </script>
          </body>
          </html>
          HTML

          cat > android-app/package.json <<'JSON'
          {
            "name": "rl33-android-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capacitor/splash-screen": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          JSON

          cat > android-app/capacitor.config.json <<'JSON'
          {
            "appId": "com.rl33.institute",
            "appName": "RL-33",
            "webDir": "www",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 500,
                "launchAutoHide": true,
                "backgroundColor": "#071A3A",
                "showSpinner": false
              }
            }
          }
          JSON

      - name: Install Capacitor
        working-directory: android-app
        run: npm install

      - name: Generate Android project
        working-directory: android-app
        run: npx cap add android

      - name: Sync web files
        working-directory: android-app
        run: npx cap sync android

      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: RL-33-Android-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
